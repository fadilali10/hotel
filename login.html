<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hotel Management Login</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            min-height: 100vh;
            background: #f5f6fa;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .auth-card {
            background: white;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.08);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 12px;

            border-radius: 15px;

            background: #6d4aff;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 29px;
        }

        .auth-logo h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .auth-logo p {
            color: #7b8494;
            font-size: 12px;
        }

        .auth-title {
            font-size: 19px;
            margin-bottom: 6px;
        }

        .auth-description {
            color: #7b8494;
            font-size: 12px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            font-size: 11px;
            font-weight: 600;

            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            height: 45px;

            border: 1px solid #e1e4eb;
            border-radius: 8px;

            padding: 0 13px;

            font-family: inherit;
            font-size: 12px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #6d4aff;
        }

        .auth-button {
            width: 100%;
            height: 46px;

            border: 0;
            border-radius: 8px;

            background: #6d4aff;
            color: white;

            font-size: 12px;
            font-weight: 600;

            margin-top: 5px;
        }

        .auth-button:hover {
            background: #5436d6;
        }

        .auth-button:disabled {
            opacity: 0.6;
        }

        .auth-message {
            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            font-size: 11px;

            display: none;
        }

        .auth-message.error {
            display: block;

            background: #fff0f0;
            color: #c62828;
        }

        .auth-message.success {
            display: block;

            background: #edfff3;
            color: #16803c;
        }

        .auth-footer {
            text-align: center;

            margin-top: 22px;

            font-size: 11px;
            color: #7b8494;
        }

        .auth-footer a {
            color: #6d4aff;
            font-weight: 600;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">

            <div class="auth-logo-icon">
                ★
            </div>

            <h1>Hotel Management</h1>

            <p>Manage your hotel from one place</p>

        </div>


        <h2 class="auth-title">
            Welcome Back
        </h2>

        <p class="auth-description">
            Login to your hotel management account.
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="manager@hotel.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
                id="loginButton"
            >
                LOGIN
            </button>

        </form>


        <div
            id="authMessage"
            class="auth-message"
        ></div>


        <div class="auth-footer">

            Don't have a hotel account?

            <a href="register.html">
                Create Hotel
            </a>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

</body>

</html>
