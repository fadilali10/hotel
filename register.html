<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Hotel Account</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            min-height: 100vh;
            background: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-logo-icon {
            width: 55px;
            height: 55px;
            margin: 0 auto 12px;

            background: #6d4aff;
            color: white;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
        }

        .auth-logo h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .auth-logo p {
            color: #7b8494;
            font-size: 12px;
        }

        .auth-title {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .auth-description {
            color: #7b8494;
            font-size: 12px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            height: 44px;

            border: 1px solid #e1e4eb;
            border-radius: 8px;

            padding: 0 13px;

            font-family: inherit;
            font-size: 12px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #6d4aff;
        }

        .auth-button {
            width: 100%;
            height: 45px;

            border: 0;
            border-radius: 8px;

            background: #6d4aff;
            color: white;

            font-size: 12px;
            font-weight: 600;

            margin-top: 8px;
        }

        .auth-button:hover {
            background: #5436d6;
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-message {
            margin-top: 15px;
            padding: 12px;

            border-radius: 8px;

            font-size: 11px;

            display: none;
        }

        .auth-message.error {
            display: block;
            background: #fff0f0;
            color: #c62828;
        }

        .auth-message.success {
            display: block;
            background: #edfff3;
            color: #16803c;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;

            font-size: 11px;
            color: #7b8494;
        }

        .auth-footer a {
            color: #6d4aff;
            font-weight: 600;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">

            <div class="auth-logo-icon">
                ★
            </div>

            <h1>Hotel Management</h1>

            <p>Professional hotel management system</p>

        </div>


        <h2 class="auth-title">
            Create Your Hotel Account
        </h2>

        <p class="auth-description">
            Register your hotel and start managing rooms,
            guests and bookings.
        </p>


        <form id="registerForm">

            <div class="form-group">

                <label>Hotel Name *</label>

                <input
                    type="text"
                    id="hotelName"
                    placeholder="Grand Palace Hotel"
                    required
                >

            </div>


            <div class="form-group">

                <label>Owner / Manager Name *</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Phone</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="+91 9876543210"
                >

            </div>


            <div class="form-group">

                <label>Email *</label>

                <input
                    type="email"
                    id="email"
                    placeholder="manager@hotel.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password *</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
                id="registerButton"
            >
                CREATE HOTEL ACCOUNT
            </button>

        </form>


        <div
            id="authMessage"
            class="auth-message"
        ></div>


        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

</body>

</html>
